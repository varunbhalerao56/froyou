name: froyou
description: "Froyou"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_native_splash: ^2.4.7
  # go_router: ^16.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  flutter_hooks: ^0.21.3+1
  shared_preferences: ^2.5.3
  objectbox: ^5.3.2
  objectbox_flutter_libs: any
  # code_assets: ^1.0.0
  # native_toolchain_rust: ^1.0.3
  # ffi: ^2.1.4
  # flutter_rust_bridge: ^2.11.1
  progressive_blur: ^0.0.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  objectbox_generator: any

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Tokenized unDraw drawings for the intro — not standalone SVGs; every fill
    # is a role resolved against the live palette by core/ui/illustration.dart.
    # Refetch with tool/fetch_illustrations.sh.
    - assets/illustrations/

  fonts:
    # SF Pro Rounded. Only these four weights exist in the bundle — asking for
    # anything heavier than w700 makes Flutter synthesize a fake bold, so the
    # type scale in app_typography.dart stops there.
    - family: SFProRounded
      fonts:
        - asset: fonts/SF-Pro-Rounded-Regular.otf
        - asset: fonts/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: fonts/SF-Pro-Rounded-Semibold.otf
          weight: 600
        - asset: fonts/SF-Pro-Rounded-Bold.otf
          weight: 700

objectbox:
  # Writes objectbox-model.json and objectbox.g.dart to lib/generated
  output_dir: generated

# The app icon has no config here on purpose: it is rendered from
# assets/brand/app-icon.svg by ./tool/render_icon.sh, which owns all fifteen
# PNGs in AppIcon.appiconset. flutter_launcher_icons was dropped along with the
# dead block that used to sit here — it only ever resampled a source PNG, and
# there isn't one.

# The launch screen. Regenerate with ./tool/render_splash.sh — running
# `flutter_native_splash:create` on its own leaves the three LaunchImage PNGs
# box-filtered rather than Lanczos-resampled; the tool fixes them afterwards.
#
# The colours are the Paper preset's surfaces, which is what the app boots into:
# it starts neutral and follows the system, so these are the exact pixels the
# first Flutter frame paints and the handover is invisible. If Paper's surfaces
# move in theme_presets.dart, move them here too.
#
# One image serves both brightnesses. The mark is a pale bezel around a magenta
# field — it reads on either surface, and a second asset would be two things to
# keep in step with the icon instead of one.
flutter_native_splash:
  color: "#F2EFE9"
  color_dark: "#16181D"
  image: "build/splash/splash-master.png"
  ios: true
  # Android is out of scope for this app, and there is no web build.
  android: false
  web: false
